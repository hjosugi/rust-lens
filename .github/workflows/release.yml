name: Release

# Builds the VSIX for a `v*` tag, attaches it to the GitHub Release, and
# publishes it to the VS Code Marketplace (VSCE_PAT) and Open VSX (OVSX_PAT)
# only when those repository secrets are configured. Without them the release
# still ships the VSIX and the publish steps are skipped with a notice.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)publish, e.g. v0.2.0"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Package and publish
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      VSCE_PAT: ${{ secrets.VSCE_PAT }}
      OVSX_PAT: ${{ secrets.OVSX_PAT }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version v$version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Check extension syntax
        run: node --check extension.js
      - name: Check VSIX contents
        run: npm run check:package
      - name: Build VSIX
        run: npm run package
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          vsix="rust-ownership-lens-${VERSION}.vsix"
          notes="$(awk -v v="$VERSION" '
            $0 ~ "^## " v "( |$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md)"
          if [ -z "$notes" ]; then
            echo "::error::CHANGELOG.md has no section for $VERSION"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$vsix" --clobber
          else
            gh release create "$TAG" "$vsix" --title "Rust Ownership Lens $TAG" --notes "$notes" --verify-tag
          fi
      - name: Publish to VS Code Marketplace
        if: ${{ env.VSCE_PAT != '' }}
        run: npx vsce publish --packagePath "rust-ownership-lens-${VERSION}.vsix"
      - name: Skip VS Code Marketplace
        if: ${{ env.VSCE_PAT == '' }}
        run: echo "::notice::VSCE_PAT is not configured; the VSIX is attached to the GitHub Release but not published to the VS Code Marketplace."
      - name: Publish to Open VSX
        if: ${{ env.OVSX_PAT != '' }}
        run: npx --yes ovsx@1.2.0 publish "rust-ownership-lens-${VERSION}.vsix" --pat "$OVSX_PAT"
      - name: Skip Open VSX
        if: ${{ env.OVSX_PAT == '' }}
        run: echo "::notice::OVSX_PAT is not configured; skipping Open VSX."
